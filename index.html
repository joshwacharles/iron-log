<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>IRON LOG</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#121417;
  --surface:#1B1E22;
  --surface-2:#20242A;
  --line:#2A2E33;
  --chalk:#D7FF3F;
  --chalk-dim:#9CC22B;
  --ember:#FF6B4A;
  --text:#F2F3EE;
  --text-dim:#8A8F96;
  --radius:14px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
}

body{
  background:
    radial-gradient(circle at 15% 0%, rgba(215,255,63,0.05), transparent 40%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  padding-bottom:30px;
}

h1,h2,h3,.display{
  font-family:'Oswald',system-ui,sans-serif;
  text-transform:uppercase;
  letter-spacing:.02em;
  margin:0;
}

/* HEADER */

header{
  padding:22px 18px 16px;
  position:sticky;
  top:0;
  z-index:20;
  background:linear-gradient(180deg,var(--bg) 70%,rgba(18,20,23,.95));
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
}

.brand .title{
  font-size:28px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
}

.brand .title .dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--chalk);
  box-shadow:0 0 10px var(--chalk);
}

.brand .sub{
  font-size:11px;
  color:var(--text-dim);
  letter-spacing:.14em;
  font-family:'Oswald',sans-serif;
}

/* MAIN NAVIGATION */

.phase-switch{
  margin-top:16px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:2px;
}

.phase-btn{
  flex:0 0 auto;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text-dim);
  font-family:'Oswald',sans-serif;
  font-size:13px;
  cursor:pointer;
}

.phase-btn.active{
  background:var(--chalk);
  color:#12140A;
  border-color:var(--chalk);
}

/* DAY ROW */

.day-row{
  display:flex;
  gap:8px;
  padding:16px 18px 4px;
  overflow-x:auto;
}

.day-pill{
  flex:0 0 auto;
  padding:10px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text-dim);
  font-size:13px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
}

.day-pill.active{
  border-color:var(--chalk);
  color:var(--chalk);
  background:rgba(215,255,63,.08);
}

.day-pill.done{
  border-color:var(--chalk-dim);
}

.day-pill .check{
  display:none;
}

.day-pill.done .check{
  display:inline;
  color:var(--chalk);
}

/* MAIN */

main{
  padding:8px 18px 30px;
}

.day-label{
  padding:18px 2px 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.day-label h2{
  font-size:20px;
}

.focus{
  color:var(--text-dim);
  font-size:12px;
  text-align:right;
}

/* EXERCISES */

.ex-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:12px;
}

.ex-card.checked{
  border-color:var(--chalk-dim);
  background:linear-gradient(
    90deg,
    rgba(215,255,63,.07),
    rgba(215,255,63,.02)
  );
}

.checkbox{
  width:26px;
  height:26px;
  flex:0 0 26px;
  border-radius:8px;
  border:2px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.checkbox.on{
  background:var(--chalk);
  border-color:var(--chalk);
}

.checkbox svg{
  width:14px;
  opacity:0;
}

.checkbox.on svg{
  opacity:1;
}

.ex-info{
  flex:1;
}

.ex-name{
  font-size:14.5px;
  font-weight:600;
}

.ex-card.checked .ex-name{
  color:var(--text-dim);
  text-decoration:line-through;
}

.ex-meta{
  font-size:12px;
  color:var(--text-dim);
  margin-top:3px;
}

/* REFERENCE LISTS */

.reference-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:15px;
  margin-bottom:10px;
}

.reference-number{
  color:var(--chalk);
  font-family:'Oswald',sans-serif;
  font-weight:700;
  margin-right:10px;
}

.category-title{
  margin:22px 0 10px;
  font-size:20px;
  color:var(--chalk);
}

/* BUTTONS */

.finish-btn{
  width:100%;
  margin-top:16px;
  padding:16px;
  border:none;
  border-radius:12px;
  background:var(--chalk);
  color:#12140A;
  font-family:'Oswald',sans-serif;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.finish-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.reset-btn{
  width:100%;
  margin-top:10px;
  padding:14px;
  border:1px solid var(--ember);
  border-radius:12px;
  background:transparent;
  color:var(--ember);
  font-family:'Oswald',sans-serif;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

/* BOARD */

.board{
  margin:22px 2px 4px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
}

.board-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.board-head h3{
  font-size:13px;
  color:var(--text-dim);
}

.count{
  font-family:'Oswald';
  font-size:22px;
  color:var(--chalk);
}

.stat-row{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.stat-box{
  flex:1;
  background:var(--surface-2);
  border-radius:10px;
  padding:12px 6px;
  text-align:center;
}

.num{
  font-family:'Oswald';
  font-size:22px;
}

.lab{
  font-size:9px;
  color:var(--text-dim);
  text-transform:uppercase;
}

/* CALENDAR */

.calendar{
  margin-top:22px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
}

.calendar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.calendar-header h3{
  font-size:18px;
}

.month-btn{
  background:var(--surface-2);
  border:1px solid var(--line);
  color:var(--chalk);
  width:34px;
  height:34px;
  border-radius:8px;
  cursor:pointer;
  font-size:18px;
}

.weekdays,
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.weekdays div{
  text-align:center;
  font-size:10px;
  color:var(--text-dim);
}

.calendar-day{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  font-size:12px;
  background:var(--surface-2);
}

.calendar-day.empty{
  background:transparent;
}

.calendar-day.today{
  border:1px solid var(--chalk);
}

.calendar-day.workout{
  background:var(--chalk);
  color:#12140A;
  font-weight:700;
}

.calendar-day.today.workout{
  box-shadow:0 0 10px rgba(215,255,63,.5);
}

.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--chalk);
  color:#12140A;
  padding:10px 18px;
  border-radius:999px;
  opacity:0;
  transition:.25s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%);
}

.hidden{
  display:none !important;
}
</style>
</head>

/* =========================================
   DATE
========================================= */

function todayISO(){

  const d = new Date();

  const year = d.getFullYear();
  const month = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');

  return `${year}-${month}-${day}`;
}

function dateToISO(date){

  const year = date.getFullYear();
  const month = String(date.getMonth()+1).padStart(2,'0');
  const day = String(date.getDate()).padStart(2,'0');

  return `${year}-${month}-${day}`;
}


/* =========================================
   LOCAL STORAGE
========================================= */

function loadState(){

  try{

    const data = localStorage.getItem("ironlog_data_v2");

    if(data){

      const saved = JSON.parse(data);

      state.week = saved.week || 1;
      state.day = saved.day || 1;
      state.checked = saved.checked || {};
      state.sessions = saved.sessions || [];
    }

  }catch(e){
    console.log(e);
  }
}

function saveState(){

  localStorage.setItem(
    "ironlog_data_v2",
    JSON.stringify({
      week:state.week,
      day:state.day,
      checked:state.checked,
      sessions:state.sessions
    })
  );
}

      active = state.section === item.id;
    }

    btn.className = "phase-btn " + (active ? "active" : "");
    btn.textContent = item.label;

    btn.onclick = () => {

      state.checked = {};

      if(item.id.startsWith("week")){

        state.section = "week";
        state.week = Number(item.id.replace("week",""));
        state.day = 1;

      }else{

        state.section = item.id;

      }

      saveState();
      renderAll();

    };

    nav.appendChild(btn);

  });

}


/* =========================================
   CHECK SESSION DONE
========================================= */

function isSessionDone(week,day){

  return state.sessions.some(s =>
    s.date === todayISO() &&
    s.week === week &&
    s.day === day
  );

}


/* =========================================
   DAY BUTTONS
========================================= */

function renderDayRow(){

  const row = $("dayRow");

  row.innerHTML = "";

  if(state.section !== "week"){
    row.classList.add("hidden");
    return;
  }

  row.classList.remove("hidden");

  [1,2,3,4,5,6].forEach(d => {

    const done = isSessionDone(state.week,d);

    const pill = document.createElement("div");

    pill.className =
      "day-pill " +
      (state.day === d ? "active " : "") +
      (done ? "done" : "");

    pill.innerHTML =
      `DAY ${d} <span class="check">✓</span>`;

    pill.onclick = () => {

      state.day = d;
      state.checked = {};

      saveState();
      renderAll();

    };

    row.appendChild(pill);

  });

}


/* =========================================
   WEEK WORKOUT VIEW
========================================= */

function renderWeek(){

  const data = PLAN[state.week].days[state.day];

  $("dayTitle").textContent =
    `WEEK ${state.week} · DAY ${state.day}`;

  $("dayFocus").textContent =
    data.title;

  const area = $("contentArea");

  area.innerHTML = "";

  const done = isSessionDone(state.week,state.day);

  data.exercises.forEach((exercise,i) => {

    const checked = state.checked[i] || done;

    const card = document.createElement("div");

    card.className =
      "ex-card " + (checked ? "checked" : "");

    card.innerHTML = `
      <div class="checkbox ${checked ? "on" : ""}">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 12l5 5L20 6"
            stroke="#12140A"
            stroke-width="3"/>
        </svg>
      </div>

      <div class="ex-info">
        <div class="ex-name">${exercise}</div>
        <div class="ex-meta">${data.focus}</div>
      </div>
    `;

    const box = card.querySelector(".checkbox");

    if(!done){

      box.onclick = () => {

        state.checked[i] = !state.checked[i];

        saveState();
        renderWeek();

      };

    }

    area.appendChild(card);

  });

  $("finishBtn").classList.remove("hidden");
  $("resetBtn").classList.remove("hidden");
  $("statsBoard").classList.remove("hidden");
  $("calendarBox").classList.remove("hidden");

  if(done){

    $("finishBtn").textContent = "✓ Workout Logged";
    $("finishBtn").disabled = true;

  }else{

    $("finishBtn").textContent = "Finish Workout";
    $("finishBtn").disabled = false;

  }

}


/* =========================================
   L-SIT VIEW
========================================= */

function renderLSit(){

  $("dayTitle").textContent = "L-SIT / CORE SKILLS";
  $("dayFocus").textContent = "Reference";

  const area = $("contentArea");

  area.innerHTML = "";

  LSIT.forEach((exercise,i) => {

    const card = document.createElement("div");

    card.className = "reference-card";

    card.innerHTML = `
      <span class="reference-number">${i+1}.</span>
      ${exercise}
    `;

    area.appendChild(card);

  });

  $("finishBtn").classList.add("hidden");
  $("resetBtn").classList.add("hidden");
  $("statsBoard").classList.add("hidden");
  $("calendarBox").classList.add("hidden");

}


/* =========================================
   WORKOUT LIBRARY VIEW
========================================= */

function renderWorkouts(){

  $("dayTitle").textContent = "WORKOUTS";
  $("dayFocus").textContent = "Exercise Library";

  const area = $("contentArea");

  area.innerHTML = "";

  Object.entries(WORKOUTS).forEach(([category,exercises]) => {

    const title = document.createElement("h3");

    title.className = "category-title";
    title.textContent = category;

    area.appendChild(title);

    exercises.forEach((exercise,i) => {

      const card = document.createElement("div");

      card.className = "reference-card";

      card.innerHTML = `
        <span class="reference-number">${i+1}.</span>
        ${exercise}
      `;

      area.appendChild(card);

    });

  });

  $("finishBtn").classList.add("hidden");
  $("resetBtn").classList.add("hidden");
  $("statsBoard").classList.add("hidden");
  $("calendarBox").classList.add("hidden");

}


/* =========================================
   FINISH WORKOUT
========================================= */

function finishWorkout(){

  if(state.section !== "week") return;

  const data =
    PLAN[state.week].days[state.day];

  const total = data.exercises.length;

  const completed =
    Object.values(state.checked)
      .filter(Boolean)
      .length;

  if(completed < total){

    showToast(
      `Complete all ${total} exercises first`
    );

    return;
  }

  state.sessions.push({

    date:todayISO(),
    week:state.week,
    day:state.day,
    ts:Date.now()

  });

  state.checked = {};

  saveState();

  showToast("Workout logged 💪");

  renderAll();

}


/* =========================================
   WEEK RESET
========================================= */

function getWeekRange(){

  const now = new Date();

  const day = now.getDay();

  const mondayOffset =
    day === 0 ? -6 : 1-day;

  const monday = new Date(now);

  monday.setDate(
    now.getDate()+mondayOffset
  );

  monday.setHours(0,0,0,0);

  const sunday = new Date(monday);

  sunday.setDate(
    monday.getDate()+6
  );

  sunday.setHours(23,59,59,999);

  return {monday,sunday};

}

function resetWeek(){

  if(state.section !== "week") return;

  const confirmReset = confirm(
    "Reset this week's workouts?\n\nYour previous history outside this calendar week will stay saved."
  );

  if(!confirmReset) return;

  const range = getWeekRange();

  state.sessions =
    state.sessions.filter(s => {

      const date =
        new Date(s.date+"T12:00:00");

      return !(
        date >= range.monday &&
        date <= range.sunday
      );

    });

  state.checked = {};

  saveState();

  showToast("Week reset successfully");

  renderAll();

}


/* =========================================
   STATS
========================================= */

function renderStats(){

  const range = getWeekRange();

  const weekSessions =
    state.sessions.filter(s => {

      const d =
        new Date(s.date+"T12:00:00");

      return d >= range.monday &&
             d <= range.sunday &&
             s.week === state.week;

    });

  const completedDays =
    new Set(
      weekSessions.map(s =>
        `${s.date}-${s.day}`
      )
    ).size;

  $("statWeek").textContent =
    `${Math.min(completedDays,6)}/6`;

  $("statProgress").textContent =
    Math.round(
      (Math.min(completedDays,6)/6)*100
    ) + "%";

  $("statTotal").textContent =
    state.sessions.length;

  $("tallyCount").textContent =
    state.sessions.length;

}


/* =========================================
   CALENDAR
========================================= */

function renderCalendar(){

  const year =
    calendarDate.getFullYear();

  const month =
    calendarDate.getMonth();

  const monthName =
    calendarDate.toLocaleDateString(
      "en-US",
      {
        month:"long",
        year:"numeric"
      }
    );

  $("monthLabel").textContent =
    monthName;

  const grid =
    $("calendarGrid");

  grid.innerHTML = "";

  const firstDay =
    new Date(year,month,1).getDay();

  const daysInMonth =
    new Date(
      year,
      month+1,
      0
    ).getDate();

  for(let i=0;i<firstDay;i++){

    const empty =
      document.createElement("div");

    empty.className =
      "calendar-day empty";

    grid.appendChild(empty);

  }

  const workoutDates =
    new Set(
      state.sessions.map(s => s.date)
    );

  for(let day=1;day<=daysInMonth;day++){

    const cell =
      document.createElement("div");

    const date =
      new Date(year,month,day);

    const iso =
      dateToISO(date);

    cell.className =
      "calendar-day";

    if(iso === todayISO()){
      cell.classList.add("today");
    }

    if(workoutDates.has(iso)){
      cell.classList.add("workout");
    }

    cell.textContent = day;

    grid.appendChild(cell);

  }

}


/* =========================================
   CALENDAR BUTTONS
========================================= */

$("prevMonth").onclick = () => {

  calendarDate.setMonth(
    calendarDate.getMonth()-1
  );

  renderCalendar();

};

$("nextMonth").onclick = () => {

  calendarDate.setMonth(
    calendarDate.getMonth()+1
  );

  renderCalendar();

};


/* =========================================
   TOAST
========================================= */

function showToast(msg){

  const toast = $("toast");

  toast.textContent = msg;

  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(() => {

      toast.classList.remove("show");

    },2000);

}


/* =========================================
   RENDER ALL
========================================= */

function renderAll(){

  $("dateLabel").textContent =
    new Date()
      .toLocaleDateString(
        "en-US",
        {
          weekday:"short",
          month:"short",
          day:"numeric"
        }
      )
      .toUpperCase();

  renderMainNav();
  renderDayRow();

  if(state.section === "week"){

    renderWeek();
    renderStats();
    renderCalendar();

  }else if(state.section === "lsit"){

    renderLSit();

  }else if(state.section === "workouts"){

    renderWorkouts();

  }

}


/* =========================================
   EVENTS
========================================= */

$("finishBtn")
  .addEventListener(
    "click",
    finishWorkout
  );

$("resetBtn")
  .addEventListener(
    "click",
    resetWeek
  );


/* =========================================
   START
========================================= */

loadState();
renderAll();

</script>

</body>
</html>
