<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IRON LOG</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap');

:root{
  --bg:#121417;
  --surface:#1b1e22;
  --surface2:#22272f;
  --line:#2d333b;
  --lime:#d7ff3f;
  --lime2:#a8cf35;
  --red:#ff6b4a;
  --text:#f2f3ee;
  --muted:#9098a3;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:
    radial-gradient(circle at 10% 0%,rgba(215,255,63,.06),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

button{font:inherit}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(18,20,23,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:20px 18px 14px;
}

.brand{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-family:Oswald,sans-serif;
  font-size:28px;
  font-weight:700;
  letter-spacing:.5px;
}

.dot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--lime);
  box-shadow:0 0 12px var(--lime);
  margin-right:9px;
}

.date{
  font-family:Oswald,sans-serif;
  color:var(--muted);
  font-size:12px;
  letter-spacing:1px;
}

/* NAVIGATION */

.nav,
.day-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.nav{
  margin-top:15px;
}

.nav::-webkit-scrollbar,
.day-row::-webkit-scrollbar{
  display:none;
}

.nav button,
.day-pill{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--muted);
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-family:Oswald,sans-serif;
  font-weight:600;
}

.nav button.active{
  background:var(--lime);
  color:#141600;
  border-color:var(--lime);
}

.day-row{
  padding:15px 18px 0;
}

.day-pill.active{
  border-color:var(--lime);
  color:var(--lime);
  background:rgba(215,255,63,.07);
}

.day-pill.done{
  border-color:var(--lime2);
}

/* MAIN */

main{
  max-width:900px;
  margin:auto;
  padding:8px 18px 30px;
}

.heading{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:end;
  padding:20px 0 12px;
}

.heading h2,
.section-title{
  margin:0;
  font-family:Oswald,sans-serif;
  letter-spacing:.4px;
}

.focus{
  color:var(--muted);
  font-size:12px;
  text-align:right;
}

/* EXERCISES */

.exercise,
.reference-card{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
}

.exercise.checked{
  border-color:var(--lime2);
  background:linear-gradient(
    90deg,
    rgba(215,255,63,.08),
    rgba(215,255,63,.02)
  );
}

.checkbox{
  width:27px;
  height:27px;
  border:2px solid var(--line);
  border-radius:8px;
  display:grid;
  place-items:center;
  cursor:pointer;
  flex:0 0 auto;
}

.checkbox.on{
  background:var(--lime);
  border-color:var(--lime);
  color:#111;
}

.exercise-name{
  font-weight:600;
  font-size:14px;
}

.checked .exercise-name{
  text-decoration:line-through;
  color:var(--muted);
}

.meta{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

/* BUTTONS */

.finish{
  width:100%;
  border:0;
  background:var(--lime);
  color:#111;
  padding:16px;
  border-radius:12px;
  margin-top:16px;
  font-family:Oswald,sans-serif;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.finish:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.reset{
  width:100%;
  border:1px solid var(--red);
  background:transparent;
  color:var(--red);
  padding:14px;
  border-radius:12px;
  margin-top:10px;
  font-family:Oswald,sans-serif;
  font-weight:700;
  cursor:pointer;
}

/* STATS */

.panel{
  margin-top:22px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.panel-head h3{
  margin:0;
  font-family:Oswald,sans-serif;
  font-size:14px;
  color:var(--muted);
}

.count{
  font-family:Oswald,sans-serif;
  font-size:24px;
  color:var(--lime);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:14px;
}

.stat{
  background:var(--surface2);
  padding:14px 8px;
  text-align:center;
  border-radius:10px;
}

.num{
  font-family:Oswald,sans-serif;
  font-size:23px;
}

.lab{
  font-size:9px;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:3px;
}

/* CALENDAR */

.cal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.cal-head h3{
  font-family:Oswald,sans-serif;
  margin:0;
}

.month-btn{
  width:34px;
  height:34px;
  border-radius:9px;
  border:1px solid var(--line);
  background:var(--surface2);
  color:var(--lime);
  cursor:pointer;
}

.weekdays,
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.weekdays div{
  text-align:center;
  font-size:10px;
  color:var(--muted);
}

.calendar-day{
  aspect-ratio:1;
  border-radius:8px;
  background:var(--surface2);
  display:grid;
  place-items:center;
  font-size:12px;
}

.calendar-day.empty{
  background:transparent;
}

.calendar-day.today{
  outline:1px solid var(--lime);
}

.calendar-day.workout{
  background:var(--lime);
  color:#121400;
  font-weight:700;
}

/* REFERENCE */

.category{
  margin-top:24px;
  color:var(--lime);
  font-family:Oswald,sans-serif;
  font-size:22px;
}

.ref-number{
  font-family:Oswald,sans-serif;
  color:var(--lime);
  min-width:24px;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translate(-50%,20px);
  opacity:0;
  transition:.25s;
  background:var(--lime);
  color:#111;
  padding:10px 18px;
  border-radius:999px;
  font-weight:700;
  z-index:50;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.hidden{
  display:none!important;
}

@media(max-width:520px){

  .date{
    display:none;
  }

  .heading h2{
    font-size:20px;
  }

  .stats{
    gap:6px;
  }

  .num{
    font-size:20px;
  }

}
</style>

/* =====================================
   HELPERS & STATE
===================================== */

const $ = id => document.getElementById(id);

let state = {
  section: "week",
  week: 1,
  day: 1,
  checked: {},
  sessions: []
};

let calendarDate = new Date();


function dateToISO(date){

  const year = date.getFullYear();

  const month = String(
    date.getMonth() + 1
  ).padStart(2,"0");

  const day = String(
    date.getDate()
  ).padStart(2,"0");

  return `${year}-${month}-${day}`;

}


function todayISO(){

  return dateToISO(new Date());

}


function sessionKey(week,day){

  return `${todayISO()}|${week}|${day}`;

}


/* =====================================
   SAVE / LOAD
===================================== */

function loadState(){

  try{

    const saved = JSON.parse(
      localStorage.getItem("ironlog_v4")
    );

    if(saved){

      state.week = saved.week || 1;
      state.day = saved.day || 1;
      state.sessions = saved.sessions || [];

    }

  }catch(error){

    console.error(error);

  }

}


function saveState(){

  localStorage.setItem(
    "ironlog_v4",
    JSON.stringify({
      week: state.week,
      day: state.day,
      sessions: state.sessions
    })
  );

}


/* =====================================
   CHECK COMPLETION
===================================== */

function isSessionDone(week,day){

  return state.sessions.some(session =>
    session.key === sessionKey(week,day)
  );

}

function renderNav(){

  const nav = $("mainNav");

  nav.innerHTML = "";

  const items = [

    {type:"week",label:"WEEK 2",week:2},
    {type:"week",label:"WEEK 3",week:3},
    {type:"week",label:"WEEK 4",week:4},

    {type:"lsit",label:"L-SIT"},

    {type:"workouts",label:"WORKOUTS"}

  ];


  items.forEach(item => {

    const button = document.createElement("button");

    button.textContent = item.label;


    const active =

      (item.type === "week" &&
       state.section === "week" &&
       state.week === item.week)

      ||

      state.section === item.type;


    button.className =
      active ? "active" : "";


    button.onclick = () => {

      state.checked = {};


      if(item.type === "week"){

        state.section = "week";

        state.week = item.week;

        state.day = 1;

      }else{

        state.section = item.type;

      }


      renderAll();

    };


    nav.appendChild(button);

  });

}

    const pill = document.createElement("button");

    const done =
      isSessionDone(state.week,day);


    pill.className =
      "day-pill" +
      (state.day === day ? " active" : "") +
      (done ? " done" : "");


    pill.textContent =
      `DAY ${day}${done ? " ✓" : ""}`;


    pill.onclick = () => {

      state.day = day;

      state.checked = {};

      saveState();

      renderAll();

    };


    row.appendChild(pill);

  }

}


/* =====================================
   WEEK WORKOUT
===================================== */

function renderWeek(){

  const data =
    PLAN[state.week].days[state.day];


  $("dayTitle").textContent =
    `WEEK ${state.week} · DAY ${state.day}`;


  $("dayFocus").textContent =
    data.title;


  const area =
    $("contentArea");


  area.innerHTML = "";


  const done =
    isSessionDone(
      state.week,
      state.day
    );


  data.exercises.forEach(
    (exercise,index) => {

      const checked =
        done || !!state.checked[index];


      const card =
        document.createElement("div");


      card.className =
        "exercise" +
        (checked ? " checked" : "");


      card.innerHTML = `

        <div class="checkbox ${checked ? "on" : ""}">
          ${checked ? "✓" : ""}
        </div>

        <div>

          <div class="exercise-name"></div>

          <div class="meta"></div>

        </div>

      `;


      card.querySelector(
        ".exercise-name"
      ).textContent = exercise;


      card.querySelector(
        ".meta"
      ).textContent = data.focus;


      if(!done){

        card.querySelector(
          ".checkbox"
        ).onclick = () => {

          state.checked[index] =
            !state.checked[index];

          renderWeek();

        };

      }


      area.appendChild(card);

    }
  );


  $("finishBtn").classList.remove("hidden");

  $("resetBtn").classList.remove("hidden");

  $("statsBoard").classList.remove("hidden");

  $("calendarBox").classList.remove("hidden");


  $("finishBtn").disabled = done;


  $("finishBtn").textContent =
    done
      ? "✓ WORKOUT LOGGED"
      : "FINISH WORKOUT";

}


/* =====================================
   REFERENCE LIST
===================================== */

function renderReference(title,focus,items){

  $("dayTitle").textContent = title;

  $("dayFocus").textContent = focus;


  const area =
    $("contentArea");


  area.innerHTML = "";


  items.forEach((item,index) => {

    const card =
      document.createElement("div");


    card.className =
      "reference-card";


    const number =
      document.createElement("span");


    number.className =
      "ref-number";


    number.textContent =
      `${index + 1}.`;


    const text =
      document.createElement("span");


    text.textContent = item;


    card.append(number,text);

    area.appendChild(card);

  });


  [
    "finishBtn",
    "resetBtn",
    "statsBoard",
    "calendarBox"
  ].forEach(id => {

    $(id).classList.add("hidden");

  });

}


/* =====================================
   L-SIT
===================================== */

function renderLSit(){

  renderReference(
    "L-SIT / CORE SKILLS",
    "REFERENCE ONLY",
    LSIT
  );

}


/* =====================================
   WORKOUT LIBRARY
===================================== */

function renderWorkouts(){

  $("dayTitle").textContent =
    "WORKOUTS";

  $("dayFocus").textContent =
    "EXERCISE LIBRARY";


  const area =
    $("contentArea");


  area.innerHTML = "";


  for(
    const [category,list]
    of Object.entries(WORKOUTS)
  ){

    const heading =
      document.createElement("div");


    heading.className =
      "category";


    heading.textContent =
      category;


    area.appendChild(heading);


    list.forEach((exercise,index) => {

      const card =
        document.createElement("div");


      card.className =
        "reference-card";


      const number =
        document.createElement("span");


      number.className =
        "ref-number";


      number.textContent =
        `${index + 1}.`;


      const text =
        document.createElement("span");


      text.textContent =
        exercise;


      card.append(number,text);

      area.appendChild(card);

    });

  }


  [
    "finishBtn",
    "resetBtn",
    "statsBoard",
    "calendarBox"
  ].forEach(id => {

    $(id).classList.add("hidden");

  });

}


/* =====================================
   FINISH WORKOUT
===================================== */

function finishWorkout(){

  if(state.section !== "week"){

    return;

  }


  const total =
    PLAN[state.week]
      .days[state.day]
      .exercises.length;


  const completed =
    Object.values(state.checked)
      .filter(Boolean)
      .length;


  if(completed < total){

    showToast(
      `Complete all ${total} exercises first`
    );

    return;

  }


  if(
    !isSessionDone(
      state.week,
      state.day
    )
  ){

    state.sessions.push({

      key: sessionKey(
        state.week,
        state.day
      ),

      date: todayISO(),

      week: state.week,

      day: state.day,

      ts: Date.now()

    });

  }


  state.checked = {};

  saveState();


  showToast(
    "Workout logged 💪"
  );


  renderAll();

}


/* =====================================
   RESET WEEK
===================================== */

function resetWeek(){

  if(state.section !== "week"){

    return;

  }


  const confirmReset =
    confirm(
      `Reset saved workouts for WEEK ${state.week}?`
    );


  if(!confirmReset){

    return;

  }


  state.sessions =
    state.sessions.filter(
      session =>
        session.week !== state.week
    );


  state.checked = {};


  saveState();


  showToast(
    `WEEK ${state.week} reset`
  );


  renderAll();

}


/* =====================================
   STATS
===================================== */

function renderStats(){

  const uniqueDays =
    new Set(

      state.sessions
        .filter(
          session =>
            session.week === state.week
        )
        .map(
          session =>
            session.day
        )

    );


  const completed =
    Math.min(
      uniqueDays.size,
      6
    );


  $("statWeek").textContent =
    `${completed}/6`;


  $("statProgress").textContent =
    `${Math.round(
      completed / 6 * 100
    )}%`;


  $("statTotal").textContent =
    state.sessions.length;


  $("tallyCount").textContent =
    state.sessions.length;

}


/* =====================================
   CALENDAR
===================================== */

function renderCalendar(){

  const year =
    calendarDate.getFullYear();


  const month =
    calendarDate.getMonth();


  $("monthLabel").textContent =
    calendarDate
      .toLocaleDateString(
        "en-US",
        {
          month:"long",
          year:"numeric"
        }
      )
      .toUpperCase();


  const grid =
    $("calendarGrid");


  grid.innerHTML = "";


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const daysInMonth =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  for(let i = 0; i < firstDay; i++){

    const empty =
      document.createElement("div");


    empty.className =
      "calendar-day empty";


    grid.appendChild(empty);

  }


  const workoutDates =
    new Set(
      state.sessions.map(
        session =>
          session.date
      )
    );


  for(let day = 1; day <= daysInMonth; day++){

    const cell =
      document.createElement("div");


    const date =
      new Date(
        year,
        month,
        day
      );


    const iso =
      dateToISO(date);


    cell.className =
      "calendar-day" +
      (iso === todayISO()
        ? " today"
        : ""
      ) +
      (workoutDates.has(iso)
        ? " workout"
        : ""
      );


    cell.textContent =
      day;


    grid.appendChild(cell);

  }

}


/* =====================================
   TOAST
===================================== */

function showToast(message){

  const toast =
    $("toast");


  toast.textContent =
    message;


  toast.classList.add("show");


  clearTimeout(
    showToast.timer
  );


  showToast.timer =
    setTimeout(() => {

      toast.classList.remove("show");

    },1800);

}


/* =====================================
   RENDER EVERYTHING
===================================== */

function renderAll(){

  $("dateLabel").textContent =
    new Date()
      .toLocaleDateString(
        "en-US",
        {
          weekday:"short",
          month:"short",
          day:"numeric"
        }
      )
      .toUpperCase();


  renderNav();

  renderDayRow();


  if(state.section === "week"){

    renderWeek();

    renderStats();

    renderCalendar();

  }

  else if(state.section === "lsit"){

    renderLSit();

  }

  else if(state.section === "workouts"){

    renderWorkouts();

  }

}


/* =====================================
   EVENTS
===================================== */

$("finishBtn")
  .addEventListener(
    "click",
    finishWorkout
  );


$("resetBtn")
  .addEventListener(
    "click",
    resetWeek
  );


$("prevMonth").onclick = () => {

  calendarDate.setMonth(
    calendarDate.getMonth() - 1
  );

  renderCalendar();

};


$("nextMonth").onclick = () => {

  calendarDate.setMonth(
    calendarDate.getMonth() + 1
  );

  renderCalendar();

};


/* =====================================
   START
===================================== */

loadState();

renderAll();

</script>

</body>
</html>
